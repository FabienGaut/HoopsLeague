name: hoopsleague
description: "HoopsLeague - NBA Betting App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_size_text: ^3.0.0
  supabase_flutter: ^2.3.3
  fl_chart: ^1.1.1
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.3
  provider: ^6.0.5
  timezone: ^0.9.2
  mockito: ^5.4.4
  google_fonts: ^6.1.0
  responsive_framework: ^1.2.0
  http: ^1.1.0
  cloudflare_turnstile: ^3.6.0
  flutter_markdown: ^0.7.4
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/legal_docs/

  fonts:
    - family: Helvetica
      fonts:
        - asset: assets/fonts/helvetica/Helvetica.ttf
