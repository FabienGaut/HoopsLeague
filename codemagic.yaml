workflows:
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 60
    environment:
      flutter: 3.32.0
      java: 17
      groups:
        - google_play          # CM_GOOGLE_PLAY_JSON_KEY (service account JSON)
        - android_signing      # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        - supabase             # SUPABASE_URL, PUBLISHABLE_KEY
      vars:
        PACKAGE_NAME: com.hoopsleague.app
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Set up key.properties
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/upload-keystore.jks
          cat > $CM_BUILD_DIR/android/key.properties << EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: |
          flutter build appbundle \
            --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=PUBLISHABLE_KEY=$PUBLISHABLE_KEY
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $CM_GOOGLE_PLAY_JSON_KEY
        track: internal
        submit_as_draft: true

  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
      groups:
        - app_store_connect    # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
        - ios_signing          # CERTIFICATE_PRIVATE_KEY
        - supabase             # SUPABASE_URL, PUBLISHABLE_KEY
      vars:
        BUNDLE_ID: com.hoopsleague.app
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    integrations:
      app_store_connect: Hoopsleague ASC Key
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=PUBLISHABLE_KEY=$PUBLISHABLE_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
